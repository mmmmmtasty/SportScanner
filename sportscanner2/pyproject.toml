[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "sportscanner2"
version = "0.1.0"
description = "Plex custom metadata provider and managed library organizer for sports libraries."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "SportScanner Maintainers" }
]
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "PyYAML>=6.0.2",
  "SQLAlchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
  "watchdog>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "respx>=0.22.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sportscanner"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "unit: isolated tests using local fixtures, mocks, or stubs",
  "deterministic_integration: end-to-end workflow tests against the fake Plex harness",
  "plex_integration: live Plex integration tests against the local runtime and Plex server",
]

[tool.ruff]
line-length = 100
target-version = "py312"

{% extends "base.html" %}
{% block title %}Review Queue{% endblock %}
{% block content %}
<h1>Review Queue</h1>
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Segment</th>
      <th>Status</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for task in tasks %}
    <tr>
      <td>{{ task.id }}</td>
      <td>{{ task.segment_id }}</td>
      <td>{{ task.status }}</td>
      <td><a href="{{ request.url_for('review_task_detail', task_id=task.id) }}">Open</a></td>
    </tr>
    {% else %}
    <tr>
      <td colspan="4">No review tasks.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}

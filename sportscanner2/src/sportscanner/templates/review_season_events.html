{% if rows %}
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Round</th>
        <th>Event</th>
        <th>Confidence</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr class="{{ row.row_class }}">
        <td>{{ row.event.date or "—" }}</td>
        <td>{{ row.event.round or "—" }}</td>
        <td>{{ row.event.name }}</td>
        <td><span class="pill confidence-{{ row.confidence.class_name }}">{{ row.confidence.label }}</span></td>
        <td>
          <form method="post" action="{{ request.url_for('resolve_review_task', task_id=task_id) }}">
            <input type="hidden" name="event_id" value="{{ row.event.id }}" />
            <button
              type="submit"
              class="secondary compact-button"
              data-loading-label="Using Event..."
            >Use This Event</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
<p class="empty-state">No cached events found for this season. Try refreshing competition metadata first.</p>
{% endif %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}SportScanner 2{% endblock %}</title>
    <link rel="icon" href="{{ request.url_for('static', path='favicon.svg') }}" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="{{ request.url_for('static', path='app.css') }}" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  </head>
  <body>
    <main class="container">
      <nav class="topnav">
        <ul>
          <li><a href="{{ request.url_for('inbox') }}" class="brand">SportScanner 2</a></li>
        </ul>
        <ul>
          <li><a href="{{ request.url_for('inbox') }}" title="See every file, current state, and next action">Inbox</a></li>
          <li><a href="{{ request.url_for('library_page') }}" title="Browse competitions, seasons, and published recordings">Library</a></li>
          <li><a href="{{ request.url_for('plex_page') }}" title="Check Plex connection, refresh jobs, and library actions">Plex</a></li>
          <li><a href="{{ request.url_for('settings_page') }}" title="Save Plex settings and register the SportScanner provider">Settings</a></li>
          <li><a href="{{ request.url_for('logs_page') }}" title="Inspect logs, debug output, and upstream API payloads">Logs</a></li>
        </ul>
      </nav>
      <section class="workflow-banner" aria-label="Expected workflow">
        <strong>Inbox-first flow</strong>
        <div class="workflow-steps">
          <a
            href="{{ request.url_for('inbox') }}"
            class="workflow-step"
            title="Start in Inbox to see every file, current status, and next action"
          >1. Inbox</a>
          <a
            href="{{ request.url_for('library_page') }}"
            class="workflow-step"
            title="Review file detail and library context when a match needs confirmation or correction"
          >2. File Detail</a>
          <a
            href="{{ request.url_for('plex_page') }}"
            class="workflow-step"
            title="Watch Plex refresh status and trigger library refreshes when needed"
          >3. Plex</a>
          <a
            href="{{ request.url_for('logs_page') }}"
            class="workflow-step"
            title="Use Logs for debug output, upstream API payloads, and troubleshooting views"
          >4. Logs</a>
        </div>
        <span
          class="tooltip-chip"
          tabindex="0"
          title="Inbox is the primary workflow. Library, Plex, and Logs are supporting views for browsing, refreshes, and debugging."
        >Workflow guide</span>
      </section>
      <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
      {% block content %}{% endblock %}
    </main>
    <script>
      document.body.addEventListener("showToast", (event) => {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = event.detail.value || event.detail;
        container.appendChild(toast);
        window.setTimeout(() => toast.remove(), 2800);
      });
    </script>
  </body>
  </html>

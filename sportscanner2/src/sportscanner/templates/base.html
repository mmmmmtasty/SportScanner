<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}SportScanner 2{% endblock %}</title>
    <link rel="icon" href="{{ request.url_for('static', path='favicon.svg') }}" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="{{ request.url_for('static', path='app.css') }}" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  </head>
  <body>
    <main class="container">
      <nav class="topnav">
        <ul>
          <li><a href="{{ request.url_for('dashboard') }}" class="brand">SportScanner 2</a></li>
        </ul>
        <ul>
          <li><a href="{{ request.url_for('dashboard') }}">Dashboard</a></li>
          <li><a href="{{ request.url_for('review_queue') }}">Review</a></li>
          <li><a href="{{ request.url_for('competitions') }}">Competitions</a></li>
          <li><a href="{{ request.url_for('settings_page') }}">Settings</a></li>
          <li><a href="{{ request.url_for('logs_page') }}">Logs</a></li>
        </ul>
      </nav>
      {% block content %}{% endblock %}
    </main>
  </body>
  </html>
